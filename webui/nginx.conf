# -----------------------------------------------------------------------------
# Voxi WebUI static server — runs INSIDE the `webui` container.
#
# Internal only: the TLS `proxy` edge forwards /ui here over the `speech` network.
# nginx:alpine symlinks access.log -> stdout and error.log -> stderr, so every
# frontend request (and any static 404) shows up in `docker compose logs webui`
# and the Docker Desktop Logs tab.
# -----------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;

    # --- Compression -----------------------------------------------------------
    # Text assets compress well and are fetched on every cold load. wasm/onnx are
    # deliberately NOT in gzip_types: they are huge, already near-incompressible
    # on the wire, and ORT reads them with Range requests (see /models/).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # Content-hashed build output never changes, so cache it hard. CORP is
    # required because /ui/ itself is a COEP document (see below).
    location ^~ /ui/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # SPA base is /ui/ (Vite `base`). try_files gives client-side history fallback
    # so deep links like /ui/anything serve index.html instead of 404. index.html
    # itself must never be cached or a new deploy would not be picked up.
    #
    # /ui/ is ALSO the document that boots the browser engines (onnxruntime-web),
    # so it carries the cross-origin isolation headers: the SharedArrayBuffer they
    # unlock is what lets ORT run multi-threaded wasm.
    location /ui/ {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri $uri/ /ui/index.html;
    }

    # Model assets served to the browser (Turkish punctuation ONNX + optional
    # browser model packs). ORT-Web issues ranged reads, so gzip MUST stay off —
    # a recompressed body breaks the sizes checked against each pack's model.json.
    location /models/ {
        alias /usr/share/nginx/html/models/;
        types { } default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = / { return 302 /ui/; }
}
