[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "voxi"
version = "0.3.0"
description = "Self-hosted Turkish speech gateway"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "websockets==15.0.1", "pydantic==2.11.4",
  "httpx==0.28.1", "python-multipart==0.0.20",
  "prometheus-client==0.21.1", "numpy==2.2.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "openai==1.78.1", "ruff==0.11.9", "mypy==1.15.0"]
tts = ["ema-lightning==1.1.2", "normalizer-tr==0.7.0", "torch==2.7.0", "huggingface-hub==0.30.2"]
antalia = ["antalia-mini==1.0.1", "cmudict==1.0.32", "safetensors==0.5.3", "soundfile==0.13.1", "torch==2.7.0", "huggingface-hub==0.30.2"]
stt = ["faster-whisper==1.2.1", "ctranslate2==4.6.0", "av==16.0.1", "onnxruntime==1.22.0", "tokenizers==0.21.1", "huggingface-hub==0.30.2", "setuptools==80.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
# Explicit because ruff respects .gitignore only inside a git checkout; a fresh
# clone pre-git-init (or a bare working tree) must lint cleanly too.
extend-exclude = [".venv-export", "_scratch_reference", "example-projects", "models", "certs.saved"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
