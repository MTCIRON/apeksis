# EXAMPLE overlay — merging Apeksis into an ALREADY-RUNNING Compose stack.
# Checked in as a template, ON PURPOSE not part of the CI validation matrix
# (it references an external network that exists only in the consuming stack).
#
# It demonstrates three independent capabilities; take the blocks you need:
#   1. publishing the TLS proxy on a LAN address instead of loopback, in
#      trusted-LAN injected mode (VOXI_ALLOW_LAN_INJECT=true);
#   2. serving models from a central host directory (/opt/ai-models/voxi)
#      instead of the Compose named volumes (all model mounts are read-only);
#   3. joining an existing stack network so other containers (OpenWebUI, ...)
#      reach the gateway by service DNS: http://gateway:8080/v1
#
# Run order matters: this overlay LAST, after the base file and the proxy
# overlay; the proxy position below REPLACES the base binding (!override):
#   docker compose -f compose.yaml -f infra/compose.proxy.yaml \
#                  -f infra/compose.lan-stack.example.yaml up -d --wait gateway tts-ema stt-whisper webui proxy
#
# The consuming stack's .env supplies (documented in .env.example):
#   VOXI_PROXY_BIND_IP=10.0.0.231        # this server's LAN address
#   VOXI_PROXY_PORT=8102                 # published console port
#   VOXI_ALLOW_LAN_INJECT=true           # explicit trusted-LAN opt-in
#   VOXI_PROXY_EXTRA_HOSTS=10.0.0.231    # hosts the injector treats as same-site
#   VOXI_CPU_THREADS=8
#   REQUIRE_PROVIDED_CERTS=1             # your own SAN certificate (integrations/nginx/README.md)
#   VOXI_JOIN_NETWORK=app-network        # the consuming stack's network name
#
# Certificate note: when the one-shot `secrets` service generates the pair, the
# SAN automatically includes VOXI_PROXY_BIND_IP. Provide your own pair when
# REQUIRE_PROVIDED_CERTS=1. LAN TLS works best with an IP: SAN for the LAN
# address, otherwise browsers show a name-mismatch warning.

services:
  proxy:
    ports: !override
      - "${VOXI_PROXY_BIND_IP:-127.0.0.1}:${VOXI_PROXY_PORT:-8443}:8443"

  # Model mounts: override the named-volume mounts of the two CPU workers with
  # one central host tree. The layout stays EXACTLY the provisioned one:
  #   /opt/ai-models/voxi/models/ema-lightning  (32.8 MB, pinned SHA-256)
  #   /opt/ai-models/voxi/models/whisper-small  (463.7 MB, pinned SHA-256)
  tts-ema:
    volumes: !override
      - /opt/ai-models/voxi/models:/models:ro
      - secrets:/run/voxi-secrets:ro
  stt-whisper:
    volumes: !override
      - /opt/ai-models/voxi/models:/models:ro
      - secrets:/run/voxi-secrets:ro
  webui:
    volumes: !override
      # Served studio model packs + transcription ONNX runtime assets.
      - /opt/ai-models/voxi/models:/usr/share/nginx/html/models:ro

networks:
  # Join the consuming stack's network: service DNS (`gateway`) works for any
  # container already on it, without republishing the gateway port.
  speech:
    name: ${VOXI_JOIN_NETWORK:-voxi_speech}
    external: true
